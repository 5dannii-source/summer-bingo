function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s){ return esc(s).replace(/`/g,'&#96;'); }
function delay(ms){ return new Promise(r=>setTimeout(r, ms)); }

/* ===================== Supabase 연결 & 저장소 헬퍼 (재시도 포함) ===================== */
const SUPABASE_URL = 'https://xyekwijjrsfrtcrckivo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_k_zMjpNCOscpx3zmboF4GA_HwhHYO36';
const KV_TABLE = 'bingo_kv';

let sb = null, sbInitError = null;
try{
  if(!window.supabase || !window.supabase.createClient){
    throw new Error('supabase-js 라이브러리를 불러오지 못했습니다 (CDN 차단 가능성)');
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(e){ sbInitError = e; console.error('supabase init error', e); }

/* --- 오류를 사람이 읽을 수 있게 풀어주는 진단기 --- */
function rawErrText(e){
  if(!e) return '(오류 객체 없음)';
  const p = [];
  if(e.code) p.push('code=' + e.code);
  if(e.status) p.push('status=' + e.status);
  if(e.message) p.push(e.message);
  if(e.details) p.push('details=' + e.details);
  if(e.hint) p.push('hint=' + e.hint);
  return p.length ? p.join(' | ') : String(e);
}
function diagnose(e){
  if(sbInitError) return 'supabase-js 라이브러리 자체가 로드되지 않았어요. 인터넷 차단, 광고차단 확장, 또는 미리보기 샌드박스에서 외부 스크립트가 막힌 경우예요.';
  const msg = ((e && e.message) || '') + ' ' + ((e && e.details) || '');
  const m = msg.toLowerCase();
  const code = e && e.code;
  const status = e && e.status;
  if(m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed') || m.includes('typeerror: fetch'))
    return '브라우저가 Supabase 서버에 연결조차 하지 못했어요.\n① 이 파일을 Claude 미리보기 창이 아니라 진짜 브라우저(또는 웹에 올린 주소)에서 열어보세요\n② 학교/사내 방화벽·광고차단 확장 확인\n③ Supabase 프로젝트가 일시정지(pause) 상태인지 확인';
  if(status === 401 || status === 403 || m.includes('invalid api key') || m.includes('no api key'))
    return 'API 키가 거부됐어요. Supabase 대시보드 → Project Settings → API Keys 에서 현재 유효한 publishable(또는 anon) 키를 다시 복사해 코드 상단 SUPABASE_KEY 에 넣어주세요.';
  if(code === '42P01' || (m.includes('relation') && m.includes('does not exist')) || status === 404)
    return "'" + KV_TABLE + "' 테이블이 없어요(또는 이름이 달라요). 아래 SQL을 Supabase SQL Editor에서 실행하세요.";
  if(code === '42P10' || m.includes('on conflict'))
    return "'key' 열에 기본키/UNIQUE 제약이 없어서 upsert가 실패해요. 아래 SQL을 실행하세요.";
  if(code === 'PGRST204' || code === '42703' || m.includes('column'))
    return '테이블 열 구성이 앱과 달라요 (key / value / updated_at). 아래 SQL을 실행하세요.';
  if(code === '42501' || m.includes('row-level security') || m.includes('violates row-level'))
    return 'RLS(행 보안) 정책 때문에 쓰기가 차단됐어요. anon 역할에 select/insert/update/delete 정책이 필요해요. 아래 SQL을 실행하세요.';
  if(code === '22P02' || m.includes('invalid input syntax'))
    return "value 열 타입이 jsonb가 아닐 수 있어요(text 등). 아래 SQL대로 jsonb 로 맞춰주세요.";
  return '원인이 자동으로 특정되지 않았어요. 아래 원본 오류 메시지를 확인해주세요.';
}
const FIX_SQL = `create table if not exists public.bingo_kv (
  key        text primary key,
  value      jsonb,
  updated_at timestamptz default now()
);
alter table public.bingo_kv enable row level security;
drop policy if exists bingo_kv_all on public.bingo_kv;
create policy bingo_kv_all on public.bingo_kv
  for all to anon, authenticated
  using (true) with check (true);`;

async function withRetry(fn, retries=2, delayMs=400){
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{ return await fn(); }
    catch(e){
      lastErr = e;
      // 설정/권한 오류는 재시도해도 소용없으므로 즉시 중단
      const c = e && e.code;
      if(c==='42P01'||c==='42P10'||c==='42501'||c==='PGRST204'||c==='42703'||e.status===401||e.status===403) break;
      if(i<retries) await delay(delayMs*(i+1));
    }
  }
  throw lastErr;
}

/* 오류를 던지는 원본 호출 (supabase-js 는 throw 대신 {error} 를 돌려주므로 직접 throw) */
async function q(builder){
  const { data, error } = await builder;
  if(error) throw error;
  return data;
}

let HAS_UPDATED_AT = true;
async function rawUpsert(key, value){
  const row = HAS_UPDATED_AT
    ? { key, value, updated_at: new Date().toISOString() }
    : { key, value };
  return await q(sb.from(KV_TABLE).upsert(row, { onConflict: 'key' }));
}

let lastStorageError = null;
async function reportStorageError(op, key, e){
  lastStorageError = e;
  console.error('storage ' + op + ' error', key, e);
  await customAlert(
    '❗ ' + op + '에 실패했어요.\n\n[원인 추정]\n' + diagnose(e) +
    '\n\n[원본 오류]\n' + rawErrText(e)
  );
}

/* 읽기: 실패를 숨기지 않고 던진다 (숨기면 "데이터 없음"으로 오인해 덮어쓸 위험) */
async function getValStrict(key){
  if(!sb) throw sbInitError;
  const data = await withRetry(()=> q(sb.from(KV_TABLE).select('value').eq('key', key).maybeSingle()));
  return data ? data.value : null;
}
async function getVal(key){
  try{ return await getValStrict(key); }
  catch(e){ console.error('storage get error', key, e); lastStorageError = e; return null; }
}
async function setVal(key, value){
  if(!sb){ await reportStorageError('저장', key, sbInitError); return false; }
  try{
    try{
      await withRetry(()=> rawUpsert(key, value));
    }catch(e){
      // updated_at 열이 없는 테이블이면 그 열을 빼고 한 번 더 시도
      const noCol = (e && (e.code==='PGRST204' || e.code==='42703')) || /updated_at/i.test((e && e.message) || '');
      if(HAS_UPDATED_AT && noCol){
        HAS_UPDATED_AT = false;
        await withRetry(()=> rawUpsert(key, value));
      } else throw e;
    }
    return true;
  }catch(e){
    await reportStorageError('저장', key, e);
    return false;
  }
}
async function delVal(key){
  if(!sb) return;
  try{ await withRetry(()=> q(sb.from(KV_TABLE).delete().eq('key', key))); }
  catch(e){ console.error('storage del error', key, e); }
}
async function listKeys(prefix){
  try{
    const data = await withRetry(()=> q(sb.from(KV_TABLE).select('key').like('key', prefix + '%')));
    return (data||[]).map(r=>r.key);
  }catch(e){ console.error('storage list error', prefix, e); return []; }
}

/* 연결 자가진단: 읽기 1회 + 쓰기 1회를 실제로 해본다 */
async function selfTest(){
  if(!sb) return { ok:false, step:'라이브러리 로드', error:sbInitError };
  try{ await getValStrict('__conn_test'); }
  catch(e){ return { ok:false, step:'읽기(select)', error:e }; }
  try{
    try{ await rawUpsert('__conn_test', { at:new Date().toISOString() }); }
    catch(e){
      const noCol = (e && (e.code==='PGRST204' || e.code==='42703')) || /updated_at/i.test((e&&e.message)||'');
      if(HAS_UPDATED_AT && noCol){ HAS_UPDATED_AT = false; await rawUpsert('__conn_test', { at:new Date().toISOString() }); }
      else throw e;
    }
  }catch(e){ return { ok:false, step:'쓰기(upsert)', error:e }; }
  return { ok:true };
}

function hashStr(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){ hash = ((hash<<5)+hash) + str.charCodeAt(i); hash = hash & hash; }
  return String(hash>>>0);
}
function hashPw(pw, salt){ return hashStr(salt+'::'+pw+'::'+salt.length); }

/* ===================== 학생 번호 (이름 대신 노출) ===================== */
/* 개인정보 보호를 위해 공개 화면에는 이름 대신 번호만 표시한다.
   번호(no)는 학생별로 고정 저장되어, 다른 학생이 삭제돼도 바뀌지 않는다. */
function studentNo(s, idx){
  return (s && typeof s.no === 'number' && s.no > 0) ? s.no : (idx + 1);
}
/* 공개 화면용: 번호만. 선생님 모드에서는 확인을 위해 이름을 함께 보여준다. */
function studentLabel(s, idx){
  const no = studentNo(s, idx);
  return state.isAdmin ? `${no}번 (${s.name})` : `${no}번`;
}
function nextStudentNo(students){
  let max = 0;
  for(const s of students){ if(typeof s.no === 'number' && s.no > max) max = s.no; }
  return max + 1;
}
/* 기존에 번호 없이 저장된 학생들에게 순서대로 번호를 부여 (최초 1회) */
async function ensureStudentNumbers(students){
  if(!Array.isArray(students) || students.length === 0) return students;
  if(students.every(s => typeof s.no === 'number' && s.no > 0)) return students;
  let next = nextStudentNo(students);
  students.forEach((s, i) => {
    if(typeof s.no !== 'number' || s.no <= 0) s.no = (next <= i+1) ? (i+1) : next++;
  });
  const used = new Set();
  students.forEach((s, i) => {
    while(used.has(s.no)) s.no++;
    used.add(s.no);
  });
  await setVal('students', students);
  return students;
}

function getEncouragement(count){
  const msgs = {
    0:["아직 시작 전이에요! 첫 미션에 도전해볼까요? 💪","여름방학이 기다리고 있어요! 첫 발을 내딛어봐요 🌱"],
    low:["좋은 시작이에요! 하나씩 채워나가요 🌱","벌써 시작했네요! 이 기세로 쭉쭉 🚀"],
    mid:["벌써 여러 개를 완료했네요! 정말 잘하고 있어요 👏","꾸준함이 대단해요! 계속 힘내봐요 🔥"],
    high:["빙고까지 얼마 안 남았어요! 화이팅! ✨","거의 다 왔어요! 완주가 눈앞이에요 🏆"],
    full:["축하합니다! 모든 미션을 완료했어요! 최고예요 🎉👑","대단해요! 알찬 여름방학을 보냈네요 🌟"]
  };
  let bucket;
  if(count===0) bucket='0';
  else if(count<=8) bucket='low';
  else if(count<=16) bucket='mid';
  else if(count<=24) bucket='high';
  else bucket='full';
  const arr = msgs[bucket];
  return arr[Math.floor(Math.random()*arr.length)];
}

function countBingoLines(doneSet){
  let lines = 0;
  for(let r=0;r<5;r++){ let ok=true; for(let c=0;c<5;c++) if(!doneSet.has(r*5+c)) ok=false; if(ok) lines++; }
  for(let c=0;c<5;c++){ let ok=true; for(let r=0;r<5;r++) if(!doneSet.has(r*5+c)) ok=false; if(ok) lines++; }
  let d1=true; for(let i=0;i<5;i++) if(!doneSet.has(i*5+i)) d1=false; if(d1) lines++;
  let d2=true; for(let i=0;i<5;i++) if(!doneSet.has(i*5+(4-i))) d2=false; if(d2) lines++;
  return lines;
}

async function renderStudentPage(sid){
  await refreshStudents(); await refreshMissions();
  const sIdx = state.studentsCache.findIndex(s=>s.id===sid);
  const student = sIdx>=0 ? state.studentsCache[sIdx] : null;
  if(!student){ state.view='home'; return renderHome(); }
  const missions = state.missionsCache;
  const data = await getStudentData(sid);
  const doneIdx = new Set(Object.keys(data.posts).map(Number));
  const count = doneIdx.size;
  const lines = countBingoLines(doneIdx);
  const isMe = !!state.authedStudent[sid];

  let cells = '';
  for(let i=0;i<25;i++){
    const done = doneIdx.has(i);
    const post = data.posts[i];
    const locked = done && post && post.visibility==='teacher';
    cells += `<div class="bingo-cell ${done?'done':''}" onclick="openMission('${sid}',${i})">
        <span class="num">${i+1}</span>
        ${locked?'<span class="lockbadge">🔒</span>':''}
        <span class="icon">${done?'✅':'⬜'}</span>
        <span class="txt">${esc(missions[i]).slice(0,16)}${missions[i].length>16?'…':''}</span>
      </div>`;
  }

  return `
    <div class="topbar">
      <div class="title"><button class="btn-ghost" onclick="goHome()">← 목록으로</button></div>
      <div>${state.isAdmin?'<span class="badge badge-teacher">선생님 모드</span>':''}</div>
    </div>
    <div class="card">
      <div class="bingo-header">
        <div>
          <h2 class="heading" style="margin:0;">🍉 ${esc(studentLabel(student, sIdx))}의 여름방학 빙고</h2>
          <div class="meta-row">완료 ${count} / 25 · 빙고 ${lines}줄 완성${isMe?' · <span style="color:var(--leaf);font-weight:700;">🔓 내 페이지로 확인됨</span>':''}</div>
        </div>
        ${!isMe? `<button class="btn-sun" onclick="promptAuth('${sid}')">🔑 내 페이지 인증하기</button>`:''}
      </div>
      <div class="encourage-banner">${getEncouragement(count)}</div>
      ${lines>0?`<div class="bingo-banner">🎉 빙고 ${lines}줄 완성! 정말 대단해요!</div>`:''}
      <div class="bingo-grid">${cells}</div>
    </div>
  `;
}

async function promptAuth(sid){
  const data = await getStudentData(sid);
  if(!data.authHash){
    await customAlert('아직 이 친구는 비밀번호를 만들지 않았어요. 미션 칸을 눌러 첫 게시글을 쓸 때 비밀번호를 만들 수 있어요!');
    return;
  }
  const pw = await customPrompt('내 페이지가 맞다면, 비밀번호를 입력해주세요 🔑', '', true);
  if(pw===null) return;
  if(hashPw(pw, sid)===data.authHash){
    state.authedStudent[sid]=true; state.pwCache[sid]=pw;
    await customAlert('인증되었어요! 이제 내 미션을 작성할 수 있어요 😊');
    render();
  } else {
    await customAlert('비밀번호가 달라요. 다시 확인해주세요!');
  }
}

function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 700;
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function submitPost(sid, idx){
  const visEl = document.querySelector('input[name=visType]:checked');
  const vis = visEl ? visEl.value : 'public';
  const pw = document.getElementById('pwInput').value;
  const pwConfirmEl = document.getElementById('pwConfirmInput');

  const data = await getStudentData(sid);
  let usePw = pw;

  if(!data.authHash){
    if(!pw || pw.length<2){ await customAlert('비밀번호를 2자 이상 입력해주세요!'); return; }
    const pwConfirm = pwConfirmEl ? pwConfirmEl.value : '';
    if(pw !== pwConfirm){ await customAlert('비밀번호 확인이 일치하지 않아요!'); return; }
    data.authHash = hashPw(pw, sid);
    state.authedStudent[sid] = true; state.pwCache[sid] = pw;
  } else {
    if(!usePw) usePw = state.pwCache[sid];
    if(!usePw || hashPw(usePw, sid) !== data.authHash){
      if(!state.isAdmin){ await customAlert('비밀번호가 틀렸어요. 다시 확인해주세요!'); return; }
    } else {
      state.authedStudent[sid] = true; state.pwCache[sid] = usePw;
    }
  }

  const existing = data.posts[idx];
  const textEl = document.getElementById('textInput');
  const text = textEl ? textEl.value.trim() : '';
  const fileInput = document.getElementById('photoInput');
  const removeEl = document.getElementById('removePhoto');
  let image = null;
  if(fileInput && fileInput.files && fileInput.files[0]){
    image = await resizeImage(fileInput.files[0]);
  } else if(existing && existing.image && !(removeEl && removeEl.checked)){
    image = existing.image;
  }
  if(!image && !text){
    await customAlert('사진이나 소감문 중 하나는 꼭 올려주세요! (둘 다 올려도 좋아요)');
    return;
  }
  const type = image ? 'photo' : 'text';

  data.posts[idx] = {
    type, text, image, visibility: vis,
    ts: existing ? existing.ts : Date.now(),
    editedTs: existing ? Date.now() : null
  };
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  closeMission();
  openStudent(sid);
}

async function deletePost(sid, idx){
  const data = await getStudentData(sid);
  if(!state.isAdmin){
    const pw = document.getElementById('pwInput').value || state.pwCache[sid];
    if(!pw || hashPw(pw, sid) !== data.authHash){ await customAlert('삭제하려면 올바른 비밀번호가 필요해요!'); return; }
  }
  if(!await customConfirm('정말 이 게시글을 삭제할까요?')) return;
  delete data.posts[idx];
  delete data.comments[idx];
  delete data.reactions[idx];
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  closeMission();
  openStudent(sid);
}

/* ===================== 댓글 ===================== */
async function addComment(sid, idx){
  const author = document.getElementById('commentAuthor').value.trim();
  const text = document.getElementById('commentText').value.trim();
  if(!author || !text){ await customAlert('번호와 댓글 내용을 모두 입력해주세요! (예: 7번)'); return; }
  const data = await getStudentData(sid);
  data.comments[idx] = data.comments[idx] || [];
  data.comments[idx].push({author, text, ts: Date.now()});
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  await renderMissionModal(sid, idx);
}
async function deleteComment(sid, idx, ci){
  if(!await customConfirm('이 댓글을 삭제할까요?')) return;
  const data = await getStudentData(sid);
  if(data.comments[idx]) data.comments[idx].splice(ci,1);
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  await renderMissionModal(sid, idx);
}

const REACTION_EMOJIS = ['👍','❤️','😆','👏','🎉'];
async function renderReactions(sid, idx){
  const row = document.getElementById('reactionRow');
  if(!row) return;
  const data = await getStudentData(sid);
  const reactions = data.reactions[idx] || {};
  let name = state.reactorName;
  row.innerHTML = REACTION_EMOJIS.map(e=>{
    const arr = reactions[e] || [];
    const active = name && arr.includes(name);
    return `<button class="reaction-btn ${active?'active':''}" onclick="toggleReaction('${sid}',${idx},'${e}')">${e} ${arr.length>0?arr.length:''}</button>`;
  }).join('');
}
async function toggleReaction(sid, idx, emoji){
  if(!state.reactorName){
    const n = await customPrompt('반응을 남기려면 번호를 알려주세요! (예: 7번)');
    if(!n) return;
    state.reactorName = n.trim();
  }
  const name = state.reactorName;
  const data = await getStudentData(sid);
  data.reactions[idx] = data.reactions[idx] || {};
  if(!data.reactions[idx][emoji]) data.reactions[idx][emoji] = [];
  const i = data.reactions[idx][emoji].indexOf(name);
  if(i>=0) data.reactions[idx][emoji].splice(i,1); else data.reactions[idx][emoji].push(name);
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  await renderReactions(sid, idx);
}

  }
  return `
    <table class="admin-table">
      <tr><th>번호</th><th>이름(선생님만 보임)</th><th>진행상황</th><th>관리</th></tr>
      ${rowsHtml || '<tr><td colspan=4 style="color:#a39c88;">등록된 학생이 없어요.</td></tr>'}
    </table>
    <hr class="divider">
    <div class="field-label">학생 추가</div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="newStudentName" placeholder="학생 이름" style="margin:0;">
      <button class="btn-leaf" onclick="addStudent()">추가</button>
    </div>
    <hr class="divider">
    <div class="field-label">여러 명 한 번에 추가 (쉼표 또는 줄바꿈으로 구분)</div>
    <textarea id="bulkStudentNames" rows="4" style="margin-bottom:8px;">${esc(STUDENTS_SEED.join(', '))}</textarea>
    <button class="btn-leaf" onclick="bulkAddStudents()">일괄 추가</button>
    <div class="small-note">이미 등록된 이름은 자동으로 건너뛰어요. 학생 이름은 <b>선생님 화면에서만</b> 보이고, 학생·학부모 화면에는 번호만 표시돼요.</div>
    <hr class="divider">
    <div class="field-label">번호 정리</div>
    <button class="btn-ghost" onclick="renumberStudents()">🔢 번호 1번부터 다시 매기기</button>
    <div class="small-note">학생을 삭제해서 번호가 비었을 때 사용하세요. 현재 목록 순서대로 1번부터 다시 부여해요.</div>
  `;
}
async function bulkAddStudents(){
  const raw = document.getElementById('bulkStudentNames').value;
  const names = raw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
  if(names.length===0){ await customAlert('추가할 이름을 입력해주세요.'); return; }
  const students = await getStudentsSafe();
  if(students===null) return;
  const existingNames = new Set(students.map(s=>s.name));
  let added = 0;
  let nextNo = nextStudentNo(students);
  names.forEach((name, i)=>{
    if(existingNames.has(name)) return;
    students.push({id:'s'+Date.now()+Math.floor(Math.random()*10000)+'_'+i, name, no: nextNo++});
    existingNames.add(name);
    added++;
  });
  const ok = await setVal('students', students);
  if(!ok) return;
  await customAlert(`${added}명 추가되었어요! (중복 ${names.length-added}명은 건너뛰었어요)`);
  render();
}
async function renumberStudents(){
  if(!await customConfirm('현재 목록 순서대로 1번부터 번호를 다시 매길까요?\n이미 올라온 게시글은 그대로 유지돼요.')) return;
  const students = await getStudentsSafe();
  if(students===null) return;
  students.forEach((s,i)=>{ s.no = i+1; });
  const ok = await setVal('students', students);
  if(!ok) return;
  await customAlert('번호를 1번부터 다시 매겼어요.');
  render();
}
async function getStudentsSafe(){
  const students = await getVal('students');
  if(students===null){
    await customAlert('학생 목록을 불러오지 못했어요. 새로고침한 뒤 다시 시도해주세요.');
    return null;
  }
  return students;
}
async function addStudent(){
  const name = document.getElementById('newStudentName').value.trim();
  if(!name){ await customAlert('이름을 입력해주세요.'); return; }
  const students = await getStudentsSafe();
  if(students===null) return;
  students.push({id:'s'+Date.now()+Math.floor(Math.random()*1000), name, no: nextStudentNo(students)});
  const ok = await setVal('students', students);
  if(!ok) return;
  render();
}
async function renameStudent(id){
  const students = await getStudentsSafe();
  if(students===null) return;
  const s = students.find(x=>x.id===id);
  if(!s) return;
  const name = await customPrompt('새 이름을 입력하세요', s.name);
  if(!name) return;
  s.name = name.trim();
  const ok = await setVal('students', students);
  if(!ok) return;
  render();
}
async function removeStudent(id, name){
  if(!await customConfirm(`${name} 학생을 삭제할까요? 모든 게시글과 기록이 함께 삭제돼요.`)) return;
  const students = await getStudentsSafe();
  if(students===null) return;
  const filtered = students.filter(s=>s.id!==id);
  const ok = await setVal('students', filtered);
  if(!ok) return;
  await delVal(studentDataKey(id));
  render();
}

function renderTabMissions(){
  const missions = state.missionsCache;
  const rows = missions.map((m,i)=>`
    <div class="mission-edit-row">
      <span>${i+1}.</span>
      <input type="text" id="missionInput${i}" value="${escAttr(m)}" style="margin:0;">
    </div>`).join('');
  return `${rows}<button class="btn-primary" onclick="saveMissions()">미션 저장</button>`;
}
async function saveMissions(){
  const missions = [];
  for(let i=0;i<25;i++) missions.push(document.getElementById('missionInput'+i).value.trim() || ('미션 '+(i+1)));
  const ok = await setVal('missions', missions);
  if(!ok) return;
  await customAlert('미션이 저장되었어요!');
  render();
}

async function renderTabPosts(){
  const students = state.studentsCache;
  let sections = '';
  for(const s of students){
    const data = await getStudentData(s.id);
    const idxs = Object.keys(data.posts).map(Number).sort((a,b)=>a-b);
    if(idxs.length===0) continue;
    let rows = '';
    for(const idx of idxs){
      const post = data.posts[idx];
      rows += `<tr>
        <td>${idx+1}. ${esc((state.missionsCache[idx]||'').slice(0,20))}</td>
        <td>${post.image?'📷':''}${post.text?'📝':''}${(!post.image&&!post.text)?'-':''}</td>
        <td><span class="badge ${post.visibility==='public'?'badge-public':'badge-teacher'}">${post.visibility==='public'?'전체공개':'선생님공개'}</span></td>
        <td><button class="btn-ghost" style="color:#D9534F;" onclick="adminDeletePost('${s.id}',${idx})">삭제</button></td>
      </tr>`;
    }
    sections += `<h3 class="heading" style="margin-bottom:6px;">${studentNo(s, students.indexOf(s))}번 ${esc(s.name)}</h3>
      <table class="admin-table">${rows}</table><hr class="divider">`;
  }
  return sections || '<div class="empty-msg">아직 작성된 게시글이 없어요.</div>';
}
async function adminDeletePost(sid, idx){
  if(!await customConfirm('이 게시글을 삭제할까요?')) return;
  const data = await getStudentData(sid);
  delete data.posts[idx];
  delete data.comments[idx];
  delete data.reactions[idx];
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  render();
}

function renderTabReset(){
  return `
    <p>전체 데이터를 초기화하면 모든 학생, 게시글, 댓글, 반응, 응원 메시지가 사라져요. 미션 목록은 기본값으로 되돌아가요.</p>
    <button class="btn-danger" onclick="resetAll()">⚠️ 전체 데이터 초기화</button>
  `;
}
async function resetAll(){
  if(!await customConfirm('정말 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없어요.')) return;
  if(!await customConfirm('한 번 더 확인할게요. 정말 초기화할까요?')) return;
  const students = (await getVal('students')) || [];
  for(const s of students){ await delVal(studentDataKey(s.id)); }
  await setVal('students', []);
  await setVal('missions', MISSIONS_DEFAULT);
  await setVal(CHEER_KEY, []);
  state.isAdmin = false;
  await customAlert('초기화되었어요. 선생님 비밀번호를 다시 설정해주세요.');
  goHome();
}

/* ===================== 시작 ===================== */
init();
</script>
</body>
</html>
