  .bingo-cell .lockbadge{position:absolute; top:3px; right:5px; font-size:0.7rem;}

  .comment{background:#fff; border-radius:12px; padding:8px 12px; margin-bottom:8px; font-size:0.88rem;}

  .reaction-btn{background:#fff; border:2px solid #EEE4CB; border-radius:20px; padding:5px 10px; font-size:0.95rem;}
  .reaction-btn.active{border-color:var(--coral); background:#FFF0EE;}
  .close-x{position:absolute; top:14px; right:18px; font-size:1.3rem; background:none; color:var(--ink); box-shadow:none; padding:2px 6px;}
  .rel{position:relative;}
  .small-note{font-size:0.8rem; color:#a39c88; margin-top:-4px; margin-bottom:10px;}
  table.admin-table{width:100%; border-collapse:collapse; font-size:0.9rem;}
  table.admin-table th, table.admin-table td{padding:8px; border-bottom:1px solid #EEE4CB; text-align:left;}
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-btn{background:#fff; color:var(--ink); box-shadow:none; border:2px solid #EEE4CB;}
  .tab-btn.active{background:var(--sky); color:#fff; border-color:var(--sky-dark);}
  .mission-edit-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .mission-edit-row span{width:26px; font-weight:700; color:#a39c88; flex-shrink:0;}
  .file-drop{border:2px dashed #E9E0C8; border-radius:14px; padding:16px; text-align:center; background:#fffef8;}
  .flex-between{display:flex; justify-content:space-between; align-items:center;}
  .badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.72rem; font-weight:700;}

  .save-indicator{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 18px; border-radius:20px; font-size:0.85rem; z-index:100; opacity:0.9;}
  ::placeholder{color:#c9c2ae;}
</style>

<body>
<div id="app"><div class="empty-msg">불러오는 중... 🌞</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ===================== 상태 ===================== */
const state = {
  view:'home', studentId:null, missionIdx:null,
  isAdmin:false, authedStudent:{}, pwCache:{}, reactorName:null,
  studentsCache:null, missionsCache:null,
};

const MISSIONS_DEFAULT = [
 "책 3권 읽고 독서 기록장 쓰기","가족과 함께 저녁 요리 만들기","하루 30분씩 3일 운동하기",
 "박물관이나 도서관 다녀오기","소중한 사람에게 손 편지 쓰기","여름 일기 3일 쓰기",
 "내 방 청소하고 정리정돈하기","새로운 요리나 간식 만들어보기","자전거나 줄넘기로 신나게 놀기",
 "식물이나 곤충 관찰하고 그림 그리기","하루 동안 스마트폰 없이 지내보기","밤하늘 별자리 관찰하기",
 "봉사활동 참여하기 (분리수거, 심부름 등)","나만의 여름 버킷리스트 만들기","물놀이나 수영하기",
 "영어 단어 10개 외우기","그림일기나 만화로 하루 표현하기","집안일 돕기 (설거지, 빨래 개기 등)",
 "좋아하는 책 속 인물에게 편지 쓰기","가족과 보드게임이나 카드게임 하기","아침 일찍 일어나 산책하기",
 "나의 장래희망 조사하고 소개 자료 만들기","종이접기나 만들기 작품 완성하기","감사한 일 5가지 적어보기",
 "방학 동안 배운 점 정리해서 발표하기"
];

const STUDENTS_SEED = [
 "나영서","노연서","박지엘","선다은","양유진","유준선","윤이아","이동학","이수빈",
 "이승찬","이찬혁","임가인","임준수","최지욱","한유찬","한형준","황서연"
];

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s){ return esc(s).replace(/`/g,'&#96;'); }
function delay(ms){ return new Promise(r=>setTimeout(r, ms)); }

/* ===================== Supabase 연결 & 저장소 헬퍼 (재시도 포함) ===================== */
const SUPABASE_URL = 'https://xyekwijjrsfrtcrckivo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_k_zMjpNCOscpx3zmboF4GA_HwhHYO36';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const KV_TABLE = 'bingo_kv';

async function withRetry(fn, retries=2, delayMs=400){
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{ return await fn(); }
    catch(e){ lastErr = e; if(i<retries) await delay(delayMs*(i+1)); }
  }
  throw lastErr;
}
async function getVal(key){
  try{
    const { data, error } = await withRetry(()=> sb.from(KV_TABLE).select('value').eq('key', key).maybeSingle());
    if(error) throw error;
    return data ? data.value : null;
  }catch(e){ console.error('storage get error', key, e); return null; }
}
async function setVal(key, value){
  try{
    const { error } = await withRetry(()=> sb.from(KV_TABLE).upsert({ key, value, updated_at: new Date().toISOString() }));
    if(error) throw error;
    return true;
  }catch(e){
    console.error('storage set error', key, e);
    await customAlert('저장 중 문제가 생겼어요 😥 인터넷 상태를 확인하고 잠시 후 다시 시도해주세요.');
    return false;
  }
}
async function delVal(key){
  try{ await withRetry(()=> sb.from(KV_TABLE).delete().eq('key', key)); }catch(e){ /* 이미 없거나 실패해도 무시 */ }
}
async function listKeys(prefix){
  try{
    const { data, error } = await withRetry(()=> sb.from(KV_TABLE).select('key').like('key', prefix + '%'));
    if(error) throw error;
    return data.map(r=>r.key);
  }catch(e){ console.error('storage list error', prefix, e); return []; }
}

function hashStr(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){ hash = ((hash<<5)+hash) + str.charCodeAt(i); hash = hash & hash; }
  return String(hash>>>0);
}
function hashPw(pw, salt){ return hashStr(salt+'::'+pw+'::'+salt.length); }

/* ===================== 학생별 데이터 (게시글+댓글+반응+비밀번호를 하나의 키로 통합) ===================== */
function studentDataKey(sid){ return 'data_'+sid; }
function emptyStudentData(){ return {authHash:null, posts:{}, comments:{}, reactions:{}}; }
async function getStudentData(sid){
  const d = await getVal(studentDataKey(sid));
  if(!d) return emptyStudentData();
  d.posts = d.posts || {}; d.comments = d.comments || {}; d.reactions = d.reactions || {};
  return d;
}
async function saveStudentData(sid, data){ return await setVal(studentDataKey(sid), data); }

/* ===================== 커스텀 알림/확인/입력 모달 (샌드박스에서 기본 alert/confirm/prompt가 막혀 있어 직접 구현) ===================== */
function closeUiModal(){ const el = document.getElementById('uiModalOverlay'); if(el) el.remove(); }
function customAlert(msg){
  return new Promise(resolve=>{
    closeUiModal();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay'; overlay.id = 'uiModalOverlay';
    overlay.innerHTML = `<div class="modal-box" style="max-width:360px;">
      <p style="font-size:1rem; margin-top:0;">${esc(msg)}</p>
      <div style="text-align:right;"><button class="btn-primary" id="uiOkBtn">확인</button></div>
    </div>`;
    document.body.appendChild(overlay);
    const finish = ()=>{ overlay.remove(); resolve(); };
    document.getElementById('uiOkBtn').onclick = finish;
    overlay.onclick = (e)=>{ if(e.target===overlay) finish(); };
  });
}
function customConfirm(msg){
  return new Promise(resolve=>{
    closeUiModal();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay'; overlay.id = 'uiModalOverlay';
    overlay.innerHTML = `<div class="modal-box" style="max-width:380px;">
      <p style="font-size:1rem; margin-top:0;">${esc(msg)}</p>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn-ghost" id="uiCancelBtn">취소</button>
        <button class="btn-primary" id="uiOkBtn">확인</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const finish = (val)=>{ overlay.remove(); resolve(val); };
    document.getElementById('uiOkBtn').onclick = ()=>finish(true);
    document.getElementById('uiCancelBtn').onclick = ()=>finish(false);
    overlay.onclick = (e)=>{ if(e.target===overlay) finish(false); };
  });
}
function customPrompt(msg, defVal, isPassword){
  return new Promise(resolve=>{
    closeUiModal();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay'; overlay.id = 'uiModalOverlay';
    overlay.innerHTML = `<div class="modal-box" style="max-width:380px;">
      <p style="font-size:1rem; margin-top:0;">${esc(msg)}</p>
      <input type="${isPassword?'password':'text'}" id="uiPromptInput" value="${escAttr(defVal||'')}">
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn-ghost" id="uiCancelBtn">취소</button>
        <button class="btn-primary" id="uiOkBtn">확인</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const input = document.getElementById('uiPromptInput');
    setTimeout(()=>{ input.focus(); input.select(); }, 30);
    const finish = (val)=>{ overlay.remove(); resolve(val); };
    document.getElementById('uiOkBtn').onclick = ()=>finish(input.value);
    document.getElementById('uiCancelBtn').onclick = ()=>finish(null);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') finish(input.value); });
    overlay.onclick = (e)=>{ if(e.target===overlay) finish(null); };
  });
}

/* ===================== 초기화 ===================== */
async function init(){
  const initialized = await getVal('__initialized');
  let students = await getVal('students');
  let missions = await getVal('missions');
  if(!initialized){
    // 정말 처음 사용하는 경우에만 기본값을 만들어 저장
    if(students===null) students = [];
    if(missions===null) missions = MISSIONS_DEFAULT;
    await setVal('students', students);
    await setVal('missions', missions);
    await setVal('__initialized', true);
  } else {
    // 이미 사용 중이던 사이트라면, 불러오기가 실패해도 절대 기존 데이터를 덮어쓰지 않는다
    if(students===null){
      students = [];
      await customAlert('학생 목록을 불러오지 못했어요. 새로고침한 뒤 다시 시도해주세요. (기존 데이터는 안전해요)');
    }
    if(missions===null){
      missions = MISSIONS_DEFAULT;
      await customAlert('미션 목록을 불러오지 못했어요. 새로고침한 뒤 다시 시도해주세요. (기존 데이터는 안전해요)');
    }
  }
  state.studentsCache = students;
  state.missionsCache = missions;
  render();
}

async function refreshStudents(){ state.studentsCache = (await getVal('students')) || []; }
async function refreshMissions(){ state.missionsCache = (await getVal('missions')) || MISSIONS_DEFAULT; }

/* ===================== 렌더 디스패치 ===================== */
async function render(){
  const app = document.getElementById('app');
  if(state.view==='home') app.innerHTML = await renderHome();
  else if(state.view==='student') app.innerHTML = await renderStudentPage(state.studentId);
  else if(state.view==='teacher') app.innerHTML = await renderTeacher();
  window.scrollTo(0,0);
}

/* ===================== 홈 화면 ===================== */
async function renderHome(){
  await refreshStudents();
  const students = state.studentsCache;
  let cards = '';
  for(const s of students){
    const data = await getStudentData(s.id);
    const count = Object.keys(data.posts).length;
    const pct = Math.round((count/25)*100);
    const circ = 2*Math.PI*24;
    const dash = circ*(pct/100);
    cards += `
      <div class="student-card" onclick="openStudent('${s.id}')">
        <div class="progress-ring">
          <svg width="56" height="56">
            <circle cx="28" cy="28" r="24" stroke="#F0E6CE" stroke-width="6" fill="none"/>
            <circle cx="28" cy="28" r="24" stroke="var(--leaf)" stroke-width="6" fill="none"
              stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
          </svg>
          <div class="pct">${count}/25</div>
        </div>
        <div class="avatar">🍉</div>
        <div class="name">${esc(s.name)}</div>
      </div>`;
  }
  return `
    <div class="topbar">
      <div class="title"><span class="sun-icon">🌻</span><h1>여름방학 미션 빙고</h1></div>
      <button class="btn-sky" onclick="openTeacher()">👩‍🏫 선생님 모드</button>
    </div>
    <div class="card">
      <h2 class="heading" style="margin-top:0;">누구의 빙고판을 볼까요?</h2>
      ${students.length===0 ? `<div class="empty-msg">아직 등록된 학생이 없어요.<br>선생님 모드에서 학생을 추가해주세요! 🧑‍🏫</div>`
        : `<div class="student-grid">${cards}</div>`}
    </div>
  `;
}

function openStudent(id){ state.studentId = id; state.view='student'; render(); }
function openTeacher(){ state.view='teacher'; render(); }
function goHome(){ state.view='home'; state.studentId=null; render(); }

/* ===================== 학생 페이지 ===================== */
function getEncouragement(count){
  const msgs = {
    0:["아직 시작 전이에요! 첫 미션에 도전해볼까요? 💪","여름방학이 기다리고 있어요! 첫 발을 내딛어봐요 🌱"],
    low:["좋은 시작이에요! 하나씩 채워나가요 🌱","벌써 시작했네요! 이 기세로 쭉쭉 🚀"],
    mid:["벌써 여러 개를 완료했네요! 정말 잘하고 있어요 👏","꾸준함이 대단해요! 계속 힘내봐요 🔥"],
    high:["빙고까지 얼마 안 남았어요! 화이팅! ✨","거의 다 왔어요! 완주가 눈앞이에요 🏆"],
    full:["축하합니다! 모든 미션을 완료했어요! 최고예요 🎉👑","대단해요! 알찬 여름방학을 보냈네요 🌟"]
  };
  let bucket;
  if(count===0) bucket='0';
  else if(count<=8) bucket='low';
  else if(count<=16) bucket='mid';
  else if(count<=24) bucket='high';
  else bucket='full';
  const arr = msgs[bucket];
  return arr[Math.floor(Math.random()*arr.length)];
}

function countBingoLines(doneSet){
  let lines = 0;
  for(let r=0;r<5;r++){ let ok=true; for(let c=0;c<5;c++) if(!doneSet.has(r*5+c)) ok=false; if(ok) lines++; }
  for(let c=0;c<5;c++){ let ok=true; for(let r=0;r<5;r++) if(!doneSet.has(r*5+c)) ok=false; if(ok) lines++; }
  let d1=true; for(let i=0;i<5;i++) if(!doneSet.has(i*5+i)) d1=false; if(d1) lines++;
  let d2=true; for(let i=0;i<5;i++) if(!doneSet.has(i*5+(4-i))) d2=false; if(d2) lines++;
  return lines;
}

function togglePostType(radioEl){
  const scope = (radioEl && radioEl.closest('.modal-box')) || document;
  const checked = scope.querySelector('input[name=postType]:checked');
  if(!checked) return;
  const type = checked.value;
  const photoField = scope.querySelector('#photoField');
  const textField = scope.querySelector('#textField');
  if(photoField) photoField.style.display = type==='photo' ? '' : 'none';
  if(textField) textField.style.display = type==='text' ? '' : 'none';
}

function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 700;
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function submitPost(sid, idx){
  const type = document.querySelector('input[name=postType]:checked').value;
  const vis = document.querySelector('input[name=visType]:checked').value;
  const pw = document.getElementById('pwInput').value;
  const pwConfirmEl = document.getElementById('pwConfirmInput');

  const data = await getStudentData(sid);
  let usePw = pw;

  if(!data.authHash){
    if(!pw || pw.length<2){ await customAlert('비밀번호를 2자 이상 입력해주세요!'); return; }
    const pwConfirm = pwConfirmEl ? pwConfirmEl.value : '';
    if(pw !== pwConfirm){ await customAlert('비밀번호 확인이 일치하지 않아요!'); return; }
    data.authHash = hashPw(pw, sid);
    state.authedStudent[sid] = true; state.pwCache[sid] = pw;
  } else {
    if(!usePw) usePw = state.pwCache[sid];
    if(!usePw || hashPw(usePw, sid) !== data.authHash){
      if(!state.isAdmin){ await customAlert('비밀번호가 틀렸어요. 다시 확인해주세요!'); return; }
    } else {
      state.authedStudent[sid] = true; state.pwCache[sid] = usePw;
    }
  }

  let text = '', image = null;
  const existing = data.posts[idx];
  if(type==='photo'){
    const fileInput = document.getElementById('photoInput');
    if(fileInput.files && fileInput.files[0]){
      image = await resizeImage(fileInput.files[0]);
    } else if(existing && existing.image){
      image = existing.image;
    } else {
      await customAlert('사진을 선택해주세요!'); return;
    }
  } else {
    text = document.getElementById('textInput').value.trim();
    if(!text){ await customAlert('소감문을 입력해주세요!'); return; }
  }

  data.posts[idx] = {
    type, text, image, visibility: vis,
    ts: existing ? existing.ts : Date.now(),
    editedTs: existing ? Date.now() : null
  };
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  closeMission();
  openStudent(sid);
}

async function deletePost(sid, idx){
  const data = await getStudentData(sid);
  if(!state.isAdmin){
    const pw = document.getElementById('pwInput').value || state.pwCache[sid];
    if(!pw || hashPw(pw, sid) !== data.authHash){ await customAlert('삭제하려면 올바른 비밀번호가 필요해요!'); return; }
  }
  if(!await customConfirm('정말 이 게시글을 삭제할까요?')) return;
  delete data.posts[idx];
  delete data.comments[idx];
  delete data.reactions[idx];
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  closeMission();
  openStudent(sid);
}

async function toggleReaction(sid, idx, emoji){
  if(!state.reactorName){
    const n = await customPrompt('반응을 남기려면 이름을 알려주세요!');
    if(!n) return;
    state.reactorName = n.trim();
  }
  const name = state.reactorName;
  const data = await getStudentData(sid);
  data.reactions[idx] = data.reactions[idx] || {};
  if(!data.reactions[idx][emoji]) data.reactions[idx][emoji] = [];
  const i = data.reactions[idx][emoji].indexOf(name);

  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  await renderReactions(sid, idx);
}

      <button class="btn-leaf" onclick="addStudent()">추가</button>
    </div>
    <hr class="divider">
    <div class="field-label">여러 명 한 번에 추가 (쉼표 또는 줄바꿈으로 구분)</div>
    <textarea id="bulkStudentNames" rows="4" style="margin-bottom:8px;">${esc(STUDENTS_SEED.join(', '))}</textarea>
    <button class="btn-leaf" onclick="bulkAddStudents()">일괄 추가</button>
    <div class="small-note">이미 등록된 이름은 자동으로 건너뛰어요.</div>
  `;
}
async function bulkAddStudents(){
  const raw = document.getElementById('bulkStudentNames').value;
  const names = raw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
  if(names.length===0){ await customAlert('추가할 이름을 입력해주세요.'); return; }
  const students = await getStudentsSafe();
  if(students===null) return;
  const existingNames = new Set(students.map(s=>s.name));
  let added = 0;
  names.forEach((name, i)=>{
    if(existingNames.has(name)) return;
    students.push({id:'s'+Date.now()+Math.floor(Math.random()*10000)+'_'+i, name});
    existingNames.add(name);
    added++;
  });
  const ok = await setVal('students', students);
  if(!ok) return;
  await customAlert(`${added}명 추가되었어요! (중복 ${names.length-added}명은 건너뛰었어요)`);
  render();
}
async function getStudentsSafe(){
  const students = await getVal('students');
  if(students===null){
    await customAlert('학생 목록을 불러오지 못했어요. 새로고침한 뒤 다시 시도해주세요.');
    return null;
  }
  return students;
}
async function addStudent(){
  const name = document.getElementById('newStudentName').value.trim();
  if(!name){ await customAlert('이름을 입력해주세요.'); return; }
  const students = await getStudentsSafe();
  if(students===null) return;
  students.push({id:'s'+Date.now()+Math.floor(Math.random()*1000), name});
  const ok = await setVal('students', students);
  if(!ok) return;
  render();
}
async function renameStudent(id){
  const students = await getStudentsSafe();
  if(students===null) return;
  const s = students.find(x=>x.id===id);
  if(!s) return;
  const name = await customPrompt('새 이름을 입력하세요', s.name);
  if(!name) return;
  s.name = name.trim();
  const ok = await setVal('students', students);
  if(!ok) return;
  render();
}
async function removeStudent(id, name){
  if(!await customConfirm(`${name} 학생을 삭제할까요? 모든 게시글과 기록이 함께 삭제돼요.`)) return;
  const students = await getStudentsSafe();
  if(students===null) return;
  const filtered = students.filter(s=>s.id!==id);
  const ok = await setVal('students', filtered);
  if(!ok) return;
  await delVal(studentDataKey(id));
  render();
}

function renderTabMissions(){
  const missions = state.missionsCache;
  const rows = missions.map((m,i)=>`
    <div class="mission-edit-row">
      <span>${i+1}.</span>
      <input type="text" id="missionInput${i}" value="${escAttr(m)}" style="margin:0;">
    </div>`).join('');
  return `${rows}<button class="btn-primary" onclick="saveMissions()">미션 저장</button>`;
}
async function saveMissions(){
  const missions = [];
  for(let i=0;i<25;i++) missions.push(document.getElementById('missionInput'+i).value.trim() || ('미션 '+(i+1)));
  const ok = await setVal('missions', missions);
  if(!ok) return;
  await customAlert('미션이 저장되었어요!');
  render();
}

async function renderTabPosts(){
  const students = state.studentsCache;
  let sections = '';
  for(const s of students){
    const data = await getStudentData(s.id);
    const idxs = Object.keys(data.posts).map(Number).sort((a,b)=>a-b);
    if(idxs.length===0) continue;
    let rows = '';
    for(const idx of idxs){
      const post = data.posts[idx];
      rows += `<tr>
        <td>${idx+1}. ${esc((state.missionsCache[idx]||'').slice(0,20))}</td>
        <td>${post.type==='photo'?'📷사진':'📝글'}</td>
        <td><span class="badge ${post.visibility==='public'?'badge-public':'badge-teacher'}">${post.visibility==='public'?'전체공개':'선생님공개'}</span></td>
        <td><button class="btn-ghost" style="color:#D9534F;" onclick="adminDeletePost('${s.id}',${idx})">삭제</button></td>
      </tr>`;
    }
    sections += `<h3 class="heading" style="margin-bottom:6px;">${esc(s.name)}</h3>
      <table class="admin-table">${rows}</table><hr class="divider">`;
  }
  return sections || '<div class="empty-msg">아직 작성된 게시글이 없어요.</div>';
}
async function adminDeletePost(sid, idx){
  if(!await customConfirm('이 게시글을 삭제할까요?')) return;
  const data = await getStudentData(sid);
  delete data.posts[idx];
  delete data.comments[idx];
  delete data.reactions[idx];
  const ok = await saveStudentData(sid, data);
  if(!ok) return;
  render();
}

function renderTabReset(){
  return `
    <p>전체 데이터를 초기화하면 모든 학생, 게시글, 댓글, 반응이 사라져요. 미션 목록은 기본값으로 되돌아가요.</p>
    <button class="btn-danger" onclick="resetAll()">⚠️ 전체 데이터 초기화</button>
  `;
}
async function resetAll(){
  if(!await customConfirm('정말 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없어요.')) return;
  if(!await customConfirm('한 번 더 확인할게요. 정말 초기화할까요?')) return;
  const students = (await getVal('students')) || [];
  for(const s of students){ await delVal(studentDataKey(s.id)); }
  await setVal('students', []);
  await setVal('missions', MISSIONS_DEFAULT);
  state.isAdmin = false;
  await customAlert('초기화되었어요. 선생님 비밀번호를 다시 설정해주세요.');
  goHome();
}

/* ===================== 시작 ===================== */
init();
</script>
